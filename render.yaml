# Render Blueprint: creates the database, the API, the website and the two scheduled jobs from this one file.
# Render dashboard > New > Blueprint > pick this repo. Fill in the values marked sync: false when asked.
#
# The two web addresses below (p5-hours-api and p5-hours-web) are what Render gives these names when they are free.
# If Render adds a suffix because a name is taken, correct CORS_ORIGIN, APP_URL and NEXT_PUBLIC_API_URL to the real
# addresses and redeploy (docs/DEPLOYMENT.md, step 3).
databases:
  - name: p5-hours-db
    region: frankfurt # closest Render region to South Africa. A service and its database must share a region.
    plan: 0.1c-256mb # the cheapest paid plan. The free database is deleted after 30 days, so never use it for real data
    databaseName: p5hours
    user: p5hours

services:
  - type: web
    name: p5-hours-api
    region: frankfurt
    runtime: node
    rootDir: backend
    plan: 0.5c-512mb # the cheapest paid plan. Free web services sleep when idle, which breaks the shared timer experience
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: p5-hours-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://p5-hours-web.onrender.com # the website's address, no trailing slash
      - key: APP_URL
        value: https://p5-hours-web.onrender.com # the same address, used in invite and reset emails
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false # first start only; remove it afterwards
      - key: ADMIN_NAME
        value: Admin
      - key: RESEND_API_KEY
        sync: false # type none to run without email for now (the admin then copies invite links by hand)
      - key: MAIL_FROM
        value: "P5 Client Hours <onboarding@resend.dev>" # only delivers to your own address until your domain is verified in Resend; then change it

  # The website people use. It only talks to the API above; it never touches the database.
  - type: web
    name: p5-hours-web
    region: frankfurt
    runtime: node
    rootDir: frontend
    plan: 0.5c-512mb
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_API_URL
        value: https://p5-hours-api.onrender.com # the API's address, no trailing slash. It is built into the site, so a change needs a redeploy.

  # Catches up on the 80% / 100% emails if one was missed. They are also sent straight after each approval.
  - type: cron
    name: p5-hours-alerts
    region: frankfurt
    runtime: node
    rootDir: backend
    schedule: "0 6,10,14,18 * * 1-5" # UTC, so 08:00 to 20:00 in South Africa
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run alerts
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: p5-hours-db
          property: connectionString
      - key: RESEND_API_KEY
        sync: false # type none to run without email for now (the admin then copies invite links by hand)
      - key: MAIL_FROM
        value: "P5 Client Hours <onboarding@resend.dev>" # only delivers to your own address until your domain is verified in Resend; then change it

  # Once a day: emails the managers when a cycle has just ended, and reminds anyone who left a timer running overnight.
  # Each message is claimed in the database first, so a repeated run never sends twice.
  - type: cron
    name: p5-hours-daily
    region: frankfurt
    runtime: node
    rootDir: backend
    schedule: "0 5 * * *" # UTC, so 07:00 in South Africa
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run daily
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: p5-hours-db
          property: connectionString
      - key: APP_URL
        sync: false # the website address, used for the links in the emails
      - key: RESEND_API_KEY
        sync: false # type none to run without email for now (the admin then copies invite links by hand)
      - key: MAIL_FROM
        value: "P5 Client Hours <onboarding@resend.dev>" # only delivers to your own address until your domain is verified in Resend; then change it
